# file: docker-compose.yml
version: "3.8"
services:
  db:
    image: postgres:14
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bookstore_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./DB/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${POSTGRES_DB:-bookstore_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:


# To start the PostgreSQL container, run:
# docker-compose up -d
# To stop the container, run:
# docker-compose down