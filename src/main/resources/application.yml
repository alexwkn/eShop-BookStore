# src/main/resources/application.yml
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookstore_db}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    hibernate:
      ddl-auto: update

server:
  port: 8082
  # Port HTTP qui redirige automatiquement vers le HTTPS (8082)
  http-port: 8080
  ssl:
    enabled: true
    key-store-type: PKCS12
    key-store: ${SSL_KEYSTORE:file:keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:bookstore-dev}
    key-password: ${SSL_KEYSTORE_PASSWORD:bookstore-dev}
    key-alias: bookstore