about.title=About Us
about.p1 = At Book Store, we are passionate about reading and sustainability. Our mission is to provide high-quality books while minimizing our environmental impact through innovative recycling practices.
about.p2= We believe that every book lover should have access to great stories without compromising the health of our planet. That?s why we use recycled materials for our book covers and packaging, and we partner with organizations dedicated to reforestation and environmental conservation.
about.commitment.title=Our Commitment
about.commitment.text= We are committed to promoting literacy and environmental responsibility. A portion of our profits goes towards supporting literacy programs and tree-planting initiatives around the world.

