about.title=À propos de nous
about.p1=Chez Book Store, nous sommes passionnés par la lecture et dévoués à fournir une vaste sélection de livres pour tous les amateurs de lecture. Fondés en 2020, nous avons pour mission de rendre la littérature accessible à tous, en offrant des titres allant des classiques intemporels aux dernières sorties.\ 
about.p2=On croit que chaque livre a le pouvoir de transporter les lecteurs vers de nouveaux mondes, d'inspirer des idées et de susciter des émotions profondes. C'est pourquoi nous nous efforçons de créer une expérience d'achat conviviale, avec un service client exceptionnel et une livraison rapide.
about.commitment.title=Notre engagement
about.commitment.text= Nous nous engageons à offrir une expérience d'achat exceptionnelle, avec une sélection soigneusement choisie de livres, des prix compétitifs et un service client dévoué. Votre satisfaction est notre priorité.

